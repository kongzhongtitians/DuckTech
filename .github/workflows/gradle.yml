name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. 构建任务 (build)
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

      # 新增：上传 build/libs 下的 jar
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ducktech-jars
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # 2. 依赖提交任务 (dependency-submission)
  # ==========================================
  dependency-submission:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5   # 升级至 v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 【容错机制】加入 gradle-version 参数，即使没有 Wrapper 也能运行
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v4
      with:
        gradle-version: 8.8  # 改成你项目对应的 Gradle 版本